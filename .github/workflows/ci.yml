name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    # The plugin is pure Node (no native deps, no OS-specific behavior), so
    # the offline smoke test runs on the cheap Ubuntu runner. The online
    # e2e (live Crossref/OpenAlex/arXiv lookups) is intentionally local-only:
    # it depends on the public bibliographic APIs and their rate limits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pdf-parse is the single runtime dependency (PDF text extraction).
      - name: Install dependencies
        run: npm ci

      # Offline: minimal PDF generation -> text extraction -> reference
      # section detection -> BibTeX/tex/plain parsing.
      - name: Offline smoke test
        run: node test-smoke.mjs
        timeout-minutes: 5
