name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    # Offline schema, citation-parser and mocked lookup regressions plus PDF
    # extraction run on Linux and Windows. The online e2e is local-only:
    # it depends on the public bibliographic APIs and their rate limits.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # pdf-parse is the single runtime dependency (PDF text extraction).
      - name: Install dependencies
        run: npm ci

      # Offline: minimal PDF generation -> text extraction -> reference
      # section detection -> BibTeX/tex/plain parsing.
      - name: Offline regression and smoke tests
        run: npm test
        timeout-minutes: 5
