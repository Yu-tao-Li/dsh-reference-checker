# 收录条目 —— 提交到 awesome-dsh-plugin 仓库时，放到：
#   data/plugins/Yu-tao-Li__dsh-refcheck.yml
# 注意：英文描述含 ": "（冒号+空格），按规则必须加引号。
url: https://github.com/Yu-tao-Li/dsh-refcheck
name: Yu-tao-Li/dsh-refcheck
category: tools
description:
  en: 'Reference verification for DeepSeek Harness: the refcheck_check model tool checks a paper''s bibliography (.pdf/.bib/.tex/.txt or pasted text) against Crossref, OpenAlex and arXiv, reports found / partial / not_found / error per entry, and emits corrected citations in the input''s style (APA, GB/T 7714, IEEE, Vancouver, MLA, Chicago, Harvard, ACS, BibTeX).'
  zh: 为 DeepSeek Harness 提供参考文献真实性检查：refcheck_check 工具将论文（PDF/BibTeX/tex/文本/粘贴列表）的每条文献对照 Crossref / OpenAlex / arXiv 核对，逐条判定 found / partial / not_found / error，并按输入样式生成可直接替换回论文的更正版引用（APA、GB/T 7714、IEEE、Vancouver、MLA、Chicago、Harvard、ACS、BibTeX）。
